name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DB_CONNECTION: mysql
  DB_HOST: 127.0.0.1
  DB_PORT: 3306
  DB_USERNAME: root
  DB_PASSWORD: root

jobs:
  php:
    name: PHP ${{ matrix.php }} (Pest${{ matrix.php == '8.4' && ', Pint, Larastan' || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.4"] # 8.2 = the oldest version the hosting may run
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mbstring, gd, intl, zip, exif, bcmath, sodium
          coverage: none
      - uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
      - run: composer validate --no-check-publish
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - name: Create the test database
        run: mysql -h127.0.0.1 -uroot -proot -e "CREATE DATABASE sakila_laravel_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
      - name: Code style (Pint)
        if: matrix.php == '8.4'
        run: vendor/bin/pint --test
      - name: Static analysis (Larastan)
        if: matrix.php == '8.4'
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress
      - name: Tests (Pest)
        run: php artisan test
      - name: Production caches build
        run: php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan event:cache && php artisan optimize:clear
      - name: Dependency advisories
        run: composer audit

  frontend:
    name: Frontend (types, lint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - name: Exported JSON Schemas are committed and up to date
        run: git diff --exit-code resources/schemas
      - name: Dependency advisories (high and critical block)
        run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: public/build
          retention-days: 3

  e2e:
    name: Browser tests (Playwright, demo seed)
    needs: [php, frontend]
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_DATABASE: sakila_laravel_e2e
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql, mbstring, gd, intl, zip, exif, bcmath
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@v4
        with:
          path: vendor
          key: composer-8.2-${{ hashFiles('composer.lock') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: build
          path: public/build
      - run: cp .env.example .env && php artisan key:generate
      - name: Database with the demo seed (what the suite asserts on)
        run: |
          mysql -h127.0.0.1 -uroot -proot -e "CREATE DATABASE sakila_laravel_e2e CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
          php artisan migrate:fresh --seed --force
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  package:
    name: cPanel package (build, import, install, update, rollback)
    needs: [php, frontend]
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      REQUIRE_PHP82: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql, mbstring, gd, intl, zip, exif, bcmath
          coverage: none
          tools: composer
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci --no-audit --no-fund
      - run: cp .env.example .env && php artisan key:generate
      - name: Build the package and run the install / update / rollback test
        run: PHP82="$(command -v php)" bash tests/deploy/run.sh
